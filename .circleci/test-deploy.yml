version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  sonarcloud: {}
# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/
# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  test:
    parameters:
      image:
        type: string
      resource_class:
        type: string
        default: medium
    docker:
      - image: <<parameters.image>>:latest
    resource_class: <<parameters.resource_class>>
    steps:
      - checkout
      - sonarcloud/scan

  test-architecture:
    parameters:
      resource_class:
        type: string
      scanner_version:
        type: string
      warm_cache:
        type: boolean
        default: false
    docker:
      - image: node:22-bookworm
    resource_class: <<parameters.resource_class>>
    environment:
      SONAR_TOKEN: "fake_token"
      SONAR_SCANNER_JSON_PARAMS: '{"sonar.scanner.internal.dumpToFile":"./output.properties"}'
    steps:
      - checkout
      - run:
          name: Verify executor architecture and absence of system Java
          command: |
            case "<<parameters.resource_class>>" in
              medium) test "$(uname -m)" = x86_64 ;;
              arm.medium) test "$(uname -m)" = aarch64 ;;
              *) exit 1 ;;
            esac
            if command -v java; then
              echo "This test requires an image without system Java" >&2
              exit 1
            fi
      - restore_cache:
          keys:
            - v<<pipeline.number>>-sonarcloud-scanner-<<parameters.scanner_version>>-{{ arch }}
      - run:
          name: Verify expected cache state
          environment:
            WARM_CACHE: "<<parameters.warm_cache>>"
          command: |
            if [ "$WARM_CACHE" = "true" ]; then
              case "$(uname -m)" in
                x86_64) arch=x64 ;;
                aarch64) arch=aarch64 ;;
                *) exit 1 ;;
              esac
              scanner=/tmp/cache/scanner/sonar-scanner-<<parameters.scanner_version>>-linux-$arch
              test -x "$scanner/bin/sonar-scanner"
              test -x "$scanner/jre/bin/java"
            else
              test ! -d /tmp/cache/scanner
            fi
      - sonarcloud/scan:
          scanner_version: <<parameters.scanner_version>>
          cache_version: <<pipeline.number>>
      - run:
          name: Verify scanner version
          command: ./src/scripts/assertFileContains.sh ./output.properties "sonar.scanner.appVersion=<<parameters.scanner_version>>"

  test-us-region:
    docker:
      - image: node:latest
    environment:
      SONAR_TOKEN: "fake_token"
      SONAR_REGION: "US"
      SONAR_SCANNER_JSON_PARAMS: '{"sonar.scanner.internal.dumpToFile":"./output.properties"}'
    steps:
      - checkout
      - sonarcloud/scan
      - run:
          name: Check scan output
          command: ./src/scripts/assertFileContains.sh ./output.properties "sonar.region=US"

  test-project-root:
    docker:
      - image: node:latest
    environment:
      SONAR_TOKEN: "fake_token"
      SONAR_SCANNER_JSON_PARAMS: '{"sonar.scanner.internal.dumpToFile":"./output.properties"}'
    steps:
      - checkout
      - run:
          command: mkdir some_folder
      - sonarcloud/scan:
          project_root: some_folder
      - run:
          name: Check scan output
          command: ./src/scripts/assertFileContains.sh ./some_folder/output.properties "some_folder"

  test-scanner-version:
    docker:
      - image: node:latest
    environment:
      SONAR_TOKEN: "fake_token"
      SONAR_SCANNER_JSON_PARAMS: '{"sonar.scanner.internal.dumpToFile":"./output.properties"}'
    steps:
      - checkout
      - sonarcloud/scan:
          scanner_version: "6.2.1.4610"
      - run:
          name: Check scan output
          command: ./src/scripts/assertFileContains.sh ./output.properties "sonar.scanner.appVersion=6.2.1.4610"

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - test:
          filters: *filters
          name: integration-test-node
          image: node
          context: SonarCloud Analysis
      - test:
          filters: *filters
          name: integration-test-circleci-python
          image: circleci/python
          context: SonarCloud Analysis
      - test:
          filters: *filters
          name: integration-test-node-arm64
          image: node
          resource_class: arm.medium
          context: SonarCloud Analysis
      - test-architecture:
          filters: *filters
          name: architecture-cold-<<matrix.resource_class>>-<<matrix.scanner_version>>
          matrix:
            alias: architecture-cold
            parameters:
              resource_class: [medium, arm.medium]
              scanner_version: ["8.0.1.6346", "6.2.1.4610"]
      - test-architecture:
          filters: *filters
          name: architecture-warm-<<matrix.resource_class>>-<<matrix.scanner_version>>
          warm_cache: true
          requires: [architecture-cold]
          matrix:
            alias: architecture-warm
            parameters:
              resource_class: [medium, arm.medium]
              scanner_version: ["8.0.1.6346", "6.2.1.4610"]
      - test-us-region:
          filters: *filters
          name: integration-test-us-region
      - test-project-root:
          filters: *filters
          name: integration-test-project-root
      - test-scanner-version:
          filters: *filters
          name: integration-test-scanner-version
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: sonarsource/sonarcloud
          vcs_type: github
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - integration-test-node
            - integration-test-circleci-python
            - integration-test-node-arm64
            - architecture-cold
            - architecture-warm
            - integration-test-us-region
            - integration-test-project-root
            - integration-test-scanner-version
          context: Publishing Orb
          filters: *release-filters
